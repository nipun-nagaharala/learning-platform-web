<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Exam Marks</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
     * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background-color: #f5f7fa;
}

.container {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 220px;
  background-color: #2c3e50;
  color: white;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 20px;
  font-size: 24px;
}

.sidebar ul {
  list-style-type: none;
}

.sidebar ul li {
  margin: 15px 0;
}

.sidebar ul li a {
  text-decoration: none;
  color: white;
  font-weight: 500;
}

.sidebar ul li a:hover {
  text-decoration: underline;
}

.main-content {
  flex: 1;
  padding: 30px;
}

header {
  margin-bottom: 30px;
}

header h1 {
  font-size: 32px;
  color: #333;
}

.cards {
  display: flex;
  gap: 20px;
}

.card {
  background-color: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  flex: 1;
}

.card h3 {
  margin-bottom: 10px;
  color: #555;
}

.card p {
  font-size: 24px;
  color: #2c3e50;
}
</style>

<body>
  <div class="container">
    <aside class="sidebar">
      <h2>Admin Panel</h2>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="students.html" class="active">Student Exam Marks</a></li>
        <li><a href="attendance.html">Show Attendance</a></li>
        <li><a href="payment.html">Make Payment</a></li>
        <li><a href="users.html">Manage Users</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header>
        <h1>Student Exam Marks</h1>
        <p>View and manage student marks.</p>
      </header>

      <section class="table-section">
        <table>
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Subject</th>
              <th>Marks</th>
              <th>Grade</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1001</td>
              <td>Alice Johnson</td>
              <td>Mathematics</td>
              <td>88</td>
              <td>A</td>
            </tr>
            <tr>
              <td>1002</td>
              <td>Bob Smith</td>
              <td>Science</td>
              <td>76</td>
              <td>B</td>
            </tr>
            <tr>
              <td>1003</td>
              <td>Clara Lee</td>
              <td>English</td>
              <td>92</td>
              <td>A+</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
</body>
</html>
