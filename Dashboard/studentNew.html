<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinansa Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f7fa;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 300px;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-right: 4px solid #1a252f;
    }

    .sidebar h2 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #34495e;
      padding-bottom: 10px;
    }

    .sidebar ul {
      list-style: none;
      padding-left: 0;
    }

    .sidebar ul li {
      margin: 10px 0;
      padding: 10px;
      background-color: #34495e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar ul li::before {
      content: "\25A0";
      color: #ecf0f1;
      font-size: 12px;
    }

    .sidebar ul li a {
      text-decoration: none;
      color: white;
      display: block;
      width: 100%;
    }

    .sidebar ul li:hover {
      background-color: #1abc9c;
    }

    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    header h1 {
      font-size: 32px;
      color: #333;
    }

    header p {
      color: #666;
      margin-top: 5px;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      flex: 1;
    }

    .card h3 {
      color: #555;
    }

    .card p {
      font-size: 24px;
      color: #2c3e50;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      background-color: #fff;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.05);
      border-radius: 8px;
      overflow: hidden;
    }

    table thead {
      background-color: #f5f5f5;
    }

    table th, table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    table tr:hover {
      background-color: #f0f8ff;
    }

    .paid {
      background-color: #c8e6c9;
    }

    .unpaid {
      background-color: #ffcdd2;
    }

    button {
      margin: 2px;
      padding: 5px 10px;
      border: none;
      background-color: #3498db;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }

    .student-analytics-chart-wrapper {
      margin-top: 40px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    .student-analytics-title {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .student-analytics-container canvas {
      width: 100% !important;
      height: 400px !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <h2>Admin Panel</h2>
      <ul>
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Students</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Grades</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header>
        <h1>Dashboard: Teachers</h1>
        <p>Welcome, Admin!</p>
      </header>

      <section class="cards">
        <div class="card">
          <h3>Total Teachers</h3>
          <p>220</p>
        </div>
        <div class="card">
          <h3>New Registrations</h3>
          <p>34</p>
        </div>
        <div class="card">
          <h3>This Month Resignations</h3>
          <p>20</p>
        </div>
      </section>

      <div class="student-analytics-chart-wrapper">
        <div class="student-analytics-title">Monthly Student Analytics (Jan - Jul)</div>
        <div class="student-analytics-container">
          <canvas id="studentLineChart"></canvas>
        </div>
      </div>

      <script>
        const ctx = document.getElementById('studentLineChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
            datasets: [
              { label: 'Total Students', data: [150, 160, 170, 180, 195, 206, 220], borderColor: '#007bff', fill: false },
              { label: 'Total Attendance', data: [140, 150, 158, 168, 180, 193, 205], borderColor: '#28a745', fill: false },
              { label: 'New Registrations', data: [10, 15, 12, 14, 18, 12, 34], borderColor: '#fd7e14', fill: false },
              { label: 'Resignations', data: [2, 5, 3, 4, 5, 1, 20], borderColor: '#dc3545', fill: false }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              title: { display: true, text: 'Student Summary (Jan - Jul)' }
            },
            scales: { y: { beginAtZero: true } }
          }
        });
      </script>

      <!-- The table section can be retained and enhanced similarly -->

    </main>
  </div>
</body>

</html>
